# Configuración de Netlify para The Algorithm by Reset
# Documentación: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Comando de build
  command = "npm run build"
  
  # Directorio de publicación
  publish = "dist"
  
  # Directorio base (raíz del proyecto)
  base = "/"

[build.environment]
  # Versión de Node.js
  NODE_VERSION = "20"

  # Versión de NPM
  NPM_VERSION = "10"

# Basic Auth de todo el sitio vía Edge Function (netlify/edge-functions/auth.js).
# Se activa SOLO si BASIC_AUTH_USER y BASIC_AUTH_PASSWORD están en el entorno de
# Netlify; sin ellas el sitio queda abierto (modo demo). Protege también /data.
[[edge_functions]]
  path = "/*"
  function = "auth"

# Redirects para SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Headers para optimización
[[headers]]
  for = "/data/*"
  [headers.values]
    # Cache de 1 hora para archivos de data
    Cache-Control = "public, max-age=3600"
    
[[headers]]
  for = "/*.js"
  [headers.values]
    # Cache de 1 año para archivos JS con hash
    Cache-Control = "public, max-age=31536000, immutable"
    
[[headers]]
  for = "/*.css"
  [headers.values]
    # Cache de 1 año para archivos CSS con hash
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    # Cache de 1 año para fuentes
    Cache-Control = "public, max-age=31536000, immutable"

# Context-specific settings
[context.production]
  command = "npm run build"
  
[context.deploy-preview]
  command = "npm run build"
  
[context.branch-deploy]
  command = "npm run build"
