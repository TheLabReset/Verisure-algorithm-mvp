# Sonda de solo lectura: baja Google Trends desde GitHub y deja busquedas.json como artefacto. No escribe en el repo.
# Se borra apenas se lee el resultado.
name: Sonda Trends
on:
  push:
    branches: [claude/modest-tesla-a7501f]
    paths: ['.github/workflows/sonda-trends.yml']
permissions:
  contents: read
jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/bajar-busquedas.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: busquedas
          path: public/data/busquedas.json
          retention-days: 1
