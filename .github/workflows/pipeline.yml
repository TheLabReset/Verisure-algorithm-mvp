# Pipeline de datos de The Algorithm: baja lo nuevo de Integrametrics y commitea public/data.
# Incremental por omisión: los últimos 7 días, incluido hoy, con merge idempotente (la fuente llega con ~1 día de
# rezago y a veces corrige la semana). Backfill: workflow_dispatch con start_date, o el cron del domingo.
# Cron 10:52 UTC = 05:52 de Lima (minuto corrido para no caer en la hora en punto, cuando GitHub atrasa los crones).
# Presupuesto de minutos y por qué falla en rojo sin token: docs/produccion-actions.md y README.
name: Pipeline de datos

on:
  schedule:
    - cron: '52 10 * * *'   # diario → incremental de 7 días
    - cron: '52 9 * * 0'    # domingo → backfill desde enero (recuadra los acumulados)
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Backfill desde esta fecha (AAAA-MM-DD). Vacío = incremental de 7 días.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTEGRAMETRICS_TOKEN: ${{ secrets.INTEGRAMETRICS_TOKEN }}
    steps:
      # Sin token no hay trabajo posible: el workflow falla en rojo para que se note, no queda verde sin hacer nada
      - name: Exigir el token
        run: |
          if [ -z "$INTEGRAMETRICS_TOKEN" ]; then
            echo "::error::Falta INTEGRAMETRICS_TOKEN en Settings → Secrets and variables → Actions. Sin token no se actualiza la data."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm run prueba

      - name: Actualizar datos
        env:
          MANUAL_START: ${{ github.event.inputs.start_date }}
          SCHEDULE: ${{ github.event.schedule }}
          PIPELINE_WINDOW: '7'
        run: |
          export PIPELINE_STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -n "$MANUAL_START" ]; then
            export PIPELINE_START="$MANUAL_START"
          elif [ "$SCHEDULE" = "52 9 * * 0" ]; then
            export PIPELINE_START="2026-01-01"
          fi
          node scripts/run-pipeline.mjs

      - name: Commit de la data si cambió
        run: |
          git config user.name "algorithm-pipeline[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Sin cambios en la data."
          else
            git commit -m "chore(pipeline): data de Integrametrics al $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
