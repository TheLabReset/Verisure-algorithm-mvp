# Pipeline de datos de The Algorithm: baja lo nuevo de Integrametrics y commitea public/data.
# Incremental por omisión: los últimos 7 días, incluido hoy, con merge idempotente (la fuente llega con ~1 día de
# rezago y a veces corrige la semana). Backfill: workflow_dispatch con start_date, o el cron del domingo.
# Cron 10:52 UTC = 05:52 de Lima (minuto corrido para no caer en la hora en punto, cuando GitHub atrasa los crones).
# Cada día arma también el contexto de MAIA. Los lunes baja Google Trends y MAIA escribe su lectura de la semana.
# Presupuesto de minutos y por qué falla en rojo sin token: docs/produccion-actions.md y README.
name: Pipeline de datos

on:
  schedule:
    - cron: '52 10 * * *'   # diario → incremental de 7 días
    - cron: '52 9 * * 0'    # domingo → backfill desde enero (recuadra los acumulados)
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Backfill desde esta fecha (AAAA-MM-DD). Vacío = incremental de 7 días.'
        required: false
        default: ''
      semanal:
        description: 'Correr también lo de los lunes (Google Trends y la lectura de MAIA).'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTEGRAMETRICS_TOKEN: ${{ secrets.INTEGRAMETRICS_TOKEN }}
    steps:
      # Sin token no hay trabajo posible: el workflow falla en rojo para que se note, no queda verde sin hacer nada
      - name: Exigir el token
        run: |
          if [ -z "$INTEGRAMETRICS_TOKEN" ]; then
            echo "::error::Falta INTEGRAMETRICS_TOKEN en Settings → Secrets and variables → Actions. Sin token no se actualiza la data."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm run prueba

      - name: Actualizar datos
        env:
          MANUAL_START: ${{ github.event.inputs.start_date }}
          SCHEDULE: ${{ github.event.schedule }}
          PIPELINE_WINDOW: '7'
        run: |
          export PIPELINE_STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -n "$MANUAL_START" ]; then
            export PIPELINE_START="$MANUAL_START"
          elif [ "$SCHEDULE" = "52 9 * * 0" ]; then
            export PIPELINE_START="2026-01-01"
          fi
          node scripts/run-pipeline.mjs

      # Los lunes (o a mano): Google Trends es semanal y la lectura de MAIA es de la semana que cerró el domingo.
      # Sin ANTHROPIC_API_KEY este paso falla en rojo, igual que el de Integrametrics sin su token.
      - name: Búsquedas y lectura de MAIA (lunes)
        if: ${{ github.event.inputs.semanal == 'true' || (github.event.schedule == '52 10 * * *' && github.event_name == 'schedule') }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.semanal }}" != "true" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "No es lunes: se omite."
            exit 0
          fi
          node scripts/bajar-busquedas.mjs
          node scripts/armar-contexto.mjs
          node scripts/maia-reporte.mjs

      # Cada día: el contexto que lee MAIA cuando le preguntan, con la data recién bajada
      - name: Contexto de MAIA
        run: node scripts/armar-contexto.mjs

      - name: Commit de la data si cambió
        run: |
          git config user.name "algorithm-pipeline[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Sin cambios en la data."
          else
            git commit -m "chore(pipeline): data de Integrametrics al $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
