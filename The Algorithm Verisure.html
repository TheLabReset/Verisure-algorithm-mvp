  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\n  <sc-if value=\"{{ drillDistritos }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closeDrill }}\" style=\"position:fixed;inset:0;background:rgba(22,24,31,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,40px)\">\n      <div onclick=\"{{ stopClick }}\" style=\"background:#FAF8F5;border-radius:20px;width:min(720px,100%);max-height:88vh;overflow:auto;padding:clamp(20px,3vw,32px);display:flex;flex-direction:column;gap:16px;box-sizing:border-box\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px\">\n          <div>\n            <h3 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;color:#16181F\">Denuncias por distrito<\u002Fh3>\n            <p style=\"margin:4px 0 0;font-size:14px;color:#565D6B\">SIDPOL · mayo 2026 · mostrando 15 de 43 distritos<\u002Fp>\n          <\u002Fdiv>\n          <button onclick=\"{{ closeDrill }}\" style=\"flex:none;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;background:#F1EDE6;color:#16181F;font-size:16px;font-weight:600\" style-hover=\"background:#E9E5DF\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ distritos }}\" as=\"d\" hint-placeholder-count=\"8\">\n            <div style=\"display:flex;align-items:center;gap:12px\">\n              <span style=\"flex:none;width:min(38%,190px);font-size:14px;color:#16181F;font-weight:500\">{{ d.n }}<\u002Fspan>\n              <div style=\"flex:1;height:16px;border-radius:999px;background:#F1EDE6;overflow:hidden\"><div style=\"height:100%;border-radius:999px;background:#565D6B;width:{{ d.w }}%\"><\u002Fdiv><\u002Fdiv>\n              <span style=\"flex:none;width:48px;text-align:right;font-size:14px;color:#565D6B;font-variant-numeric:tabular-nums\">{{ d.v }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <p style=\"margin:8px 0 0;font-size:12px;color:#8A909C\">Los 28 distritos restantes suman 6.410 denuncias (33% del total metropolitano).<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ drillBrief }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closeDrill }}\" style=\"position:fixed;inset:0;background:rgba(22,24,31,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,40px)\">\n      <div onclick=\"{{ stopClick }}\" style=\"background:#16181F;border-radius:20px;width:min(680px,100%);max-height:88vh;overflow:auto;padding:clamp(24px,3.5vw,40px);display:flex;flex-direction:column;gap:16px;box-sizing:border-box\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px\">\n          <div style=\"display:flex;align-items:center;gap:12px\">\n            <div style=\"flex:none;position:relative;width:36px;height:36px;border-radius:13px;background:#22252E;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 0 12px 4px rgba(253,238,241,.25)\">\n              <span style=\"width:7px;height:10px;border-radius:50%;background:#FFFFFF;animation:maiaBlink 6s infinite\"><\u002Fspan>\n              <span style=\"width:7px;height:10px;border-radius:50%;background:#FFFFFF;animation:maiaBlink 6s infinite\"><\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:12px;font-weight:600;letter-spacing:.14em;color:#8A909C\">DAILY BRIEF COMPLETO · JUE 10 JUL, 6:04 A. M.<\u002Fspan>\n          <\u002Fdiv>\n          <button onclick=\"{{ closeDrill }}\" style=\"flex:none;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.1);color:#FFFFFF;font-size:16px;font-weight:600\" style-hover=\"background:rgba(255,255,255,.2)\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <h3 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(20px,2.5vw,28px);line-height:1.25;color:#FFFFFF\">Prosegur volvió a la TV; la categoría juega a favor de Verisure<\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:14px;font-size:16px;line-height:1.7;color:#C9CDD4\">\n          <p style=\"margin:0\"><strong style=\"color:#FFFFFF\">Competencia.<\u002Fstrong> Prosegur abrió el día con un spot de 30 segundos en el prime de América TV — su primera pieza nueva en 12 días — y elevó su share of investment del día al 46% (S/ 118.400 estimados). El tono vuelve al registro de miedo, cerrando en alivio: «Nada es seguro, salvo tu hogar». Securitas mantiene su pauta B2B de radio sin cambios; su presión cae por tercera semana.<\u002Fp>\n          <p style=\"margin:0\"><strong style=\"color:#FFFFFF\">Demanda.<\u002Fstrong> Las búsquedas de «alarma para casa» crecen 18% en 90 días y julio entra a su ventana alta por Fiestas Patrias (+22% histórico). Verisure captura 44% de la búsqueda de marca con solo 31% de la inversión: hay 13 puntos de brecha a favor.<\u002Fp>\n          <p style=\"margin:0\"><strong style=\"color:#FFFFFF\">Amenaza DIY.<\u002Fstrong> El índice sube 4 pts a 58/100: el precio mediano de cámaras cayó a S/ 129 y la pauta de Ezviz e Imou crece en Meta. Aún sustituto parcial: sin monitoreo ni respuesta.<\u002Fp>\n          <p style=\"margin:0\"><strong style=\"color:#FFFFFF\">Contexto.<\u002Fstrong> SIDPOL de mayo confirma concentración en SJL, Los Olivos y Ate; la prensa de hoy amplifica robos en Lima Norte. Confianza del consumidor sube a 47,2.<\u002Fp>\n          <p style=\"margin:0;color:#FFFFFF\"><strong>Sugerencia del día.<\u002Fstrong> Sostener inversión en búsqueda transaccional, responder al spot de Prosegur con mensaje de respuesta verificada (no de miedo), y evaluar OOH en Los Olivos, donde la brecha de visibilidad es mayor.<\u002Fp>\n        <\u002Fdiv>\n        <span style=\"font-size:12px;color:#8A909C;padding-top:12px;border-top:1px solid rgba(255,255,255,.12)\">Generado por MAIA sobre Integrametrics, Google Trends, SIDPOL, BCRP, prensa y marketplaces · confianza de fuentes: 6/6 activas<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <footer style=\"margin-top:auto;border-top:1px solid #E9E5DF;background:#FFFFFF\">\n    <div style=\"width:100%;max-width:1280px;margin:0 auto;padding:16px clamp(16px,3vw,32px);box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap\">\n      <span style=\"font-size:12px;color:#8A909C\">The Algorithm by Reset · mockup iteración 2 · datos de ejemplo es-PE · actualizado jue 10 jul, 6:00 a. m.<\u002Fspan>\n      <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n        <span style=\"font-size:12px;color:#8A909C\">Demo estados:<\u002Fspan>\n        <button onclick=\"{{ setDemoNormal }}\" style=\"{{ demoBtnNormal }}\">Normal<\u002Fbutton>\n        <button onclick=\"{{ setDemoVacio }}\" style=\"{{ demoBtnVacio }}\">Vacío<\u002Fbutton>\n        <button onclick=\"{{ setDemoCargando }}\" style=\"{{ demoBtnCargando }}\">Cargando<\u002Fbutton>\n        <button onclick=\"{{ setDemoCaida }}\" style=\"{{ demoBtnCaida }}\">Fuente caída<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;hoyAlerta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Estado del día&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    tab: 'radar',\n    drill: null,\n    risk: false,\n    demo: 'normal',\n    draft: '',\n    typing: false,\n    scriptIndex: 0,\n    chat: [\n      { role: 'user', text: '¿Cómo se movió Prosegur esta semana?' },\n      { role: 'maia', text: 'Prosegur subió su share of investment de 37% a 46% en la semana, con dos piezas nuevas: la torre OOH de Javier Prado (28 jun) y el spot de 30 s de hoy. La presión se concentra en el prime de América TV; radio y digital se mantienen planos.', bars: [\n        { label: 'lun', w: 74, val: '37%' }, { label: 'mar', w: 78, val: '39%' }, { label: 'mié', w: 82, val: '41%' }, { label: 'jue', w: 100, val: '46%' }\n      ] }\n    ]\n  };\n\n  script = [\n    { q: '¿Dónde está invirtiendo más Prosegur?', a: { text: 'El 62% de su inversión estimada de julio está en TV abierta, concentrada en el prime de América TV. OOH pesa 27% con la torre de Javier Prado como pieza principal; radio y digital apenas 11% combinados.', bars: [\n      { label: 'TV abierta', w: 100, val: '62%' }, { label: 'OOH', w: 44, val: '27%' }, { label: 'Radio + digital', w: 18, val: '11%' }\n    ] } },\n    { q: '¿Qué distrito priorizo para OOH?', a: { text: 'Los Olivos: combina la segunda mayor incidencia de denuncias de mayo (1.310), crecimiento de búsquedas de la categoría y solo un panel rival activo. SJL tiene más denuncias, pero Prosegur ya concentra ahí 3 paneles; la brecha de visibilidad está en Lima Norte.', bars: null } }\n  ];\n\n  sendChat = () => {\n    if (this.state.typing) return;\n    const scripted = this.script[this.state.scriptIndex];\n    const q = this.state.draft.trim() || (scripted ? scripted.q : '');\n    if (!q) return;\n    this.setState(s => ({ chat: [...s.chat, { role: 'user', text: q }], draft: '', typing: true }));\n    setTimeout(() => {\n      const a = scripted ? scripted.a : { text: 'En esta demo respondo intercambios pregrabados. Cuando las APIs estén conectadas podré responder cualquier pregunta sobre las 6 fuentes del día.', bars: null };\n      this.setState(s => ({ chat: [...s.chat, { role: 'maia', text: a.text, bars: a.bars }], typing: false, scriptIndex: s.scriptIndex + 1 }));\n    }, 1400);\n  };\n\n  piezas = [\n    { marca: 'Prosegur', titulo: '«Nada es seguro, salvo tu hogar»', meta: 'hoy · América TV, PRIME · S/ 84.300 acum.', tono: 'miedo → alivio', tipo: 'tv' },\n    { marca: 'Securitas', titulo: '«Tu negocio, siempre atendido»', meta: '6 jul · RPP (radio) · S/ 32.600 acum.', tono: 'eficacia', tipo: 'radio' },\n    { marca: 'Prosegur', titulo: 'Torre OOH Javier Prado', meta: '28 jun · OOH · S/ 51.900 acum.', tono: 'eficacia', tipo: 'ooh' },\n    { marca: 'Verisure', titulo: '«Respuesta en segundos»', meta: '24 jun · Meta + YouTube · S/ 66.200 acum.', tono: 'alivio', tipo: 'social' },\n    { marca: 'Prosegur', titulo: 'Remarketing hogar seguro', meta: '21 jun · Meta · S/ 12.400 acum.', tono: 'eficacia', tipo: 'social' },\n    { marca: 'Securitas', titulo: 'Panel aeropuerto Callao', meta: '18 jun · OOH · S/ 28.700 acum.', tono: 'eficacia', tipo: 'ooh' },\n    { marca: 'Verisure', titulo: '«Tu casa responde»', meta: '15 jun · Latina, PRIME · S/ 94.100 acum.', tono: 'alivio', tipo: 'tv' },\n    { marca: 'Prosegur', titulo: 'Mención en vivo Exitosa', meta: '12 jun · radio · S/ 9.800 acum.', tono: 'miedo', tipo: 'radio' },\n    { marca: 'Ezviz (DIY)', titulo: 'Cámara wifi 2K oferta', meta: '10 jun · Meta + marketplace · S/ 6.300 acum.', tono: 'eficacia', tipo: 'social' },\n    { marca: 'Securitas', titulo: 'B2B LinkedIn guardianía', meta: '8 jun · LinkedIn · S/ 4.900 acum.', tono: 'eficacia', tipo: 'social' },\n    { marca: 'Prosegur', titulo: 'Valla Panamericana Norte', meta: '5 jun · OOH · S/ 38.200 acum.', tono: 'miedo', tipo: 'ooh' },\n    { marca: 'Verisure', titulo: 'Panel Óvalo Gutiérrez', meta: '2 jun · OOH · S/ 44.600 acum.', tono: 'alivio', tipo: 'ooh' }\n  ];\n\n  distritos = [\n    { n: 'San Juan de Lurigancho', v: '1.842', w: 100 }, { n: 'Los Olivos', v: '1.310', w: 71 }, { n: 'Ate', v: '1.276', w: 69 },\n    { n: 'San Martín de Porres', v: '1.190', w: 65 }, { n: 'Comas', v: '1.084', w: 59 }, { n: 'Callao', v: '897', w: 49 },\n    { n: 'Villa El Salvador', v: '864', w: 47 }, { n: 'San Juan de Miraflores', v: '851', w: 46 }, { n: 'Santiago de Surco', v: '812', w: 44 },\n    { n: 'Puente Piedra', v: '786', w: 43 }, { n: 'Villa María del Triunfo', v: '754', w: 41 }, { n: 'Carabayllo', v: '698', w: 38 },\n    { n: 'Chorrillos', v: '640', w: 35 }, { n: 'Rímac', v: '588', w: 32 }, { n: 'La Victoria', v: '566', w: 31 }\n  ];\n\n  renderVals() {\n    const hoyAlerta = this.props.hoyAlerta ?? true;\n    const t = this.state.tab, d = this.state.demo, drill = this.state.drill;\n    const metaByTab = {\n      radar: 'Integrametrics 6:00 a. m. · OOH scan 5:40 a. m.',\n      demanda: 'Google Trends 6:00 a. m. · marketplaces 5:30 a. m.',\n      contexto: 'SIDPOL mensual · BCRP diario · prensa 8:00 a. m.',\n      maia: 'brief generado 6:04 a. m. · 6 fuentes'\n    };\n    const btnBase = \"flex:none;border:none;cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:12px;font-weight:600;border-radius:999px;padding:7px 14px;\";\n    const demoBtn = (on) => btnBase + (on ? 'background:#16181F;color:#FFFFFF' : 'background:#F1EDE6;color:#565D6B');\n    return {\n      isRadar: t === 'radar', notRadar: t !== 'radar',\n      isDemanda: t === 'demanda', notDemanda: t !== 'demanda',\n      isContexto: t === 'contexto', notContexto: t !== 'contexto',\n      isMaia: t === 'maia', notMaia: t !== 'maia',\n      goRadar: () => this.setState({ tab: 'radar' }),\n      goDemanda: () => this.setState({ tab: 'demanda' }),\n      goContexto: () => this.setState({ tab: 'contexto' }),\n      goMaia: () => this.setState({ tab: 'maia' }),\n      metaFuentes: metaByTab[t],\n      franjaRoja: hoyAlerta && t === 'radar',\n      franjaCompacta: hoyAlerta && t !== 'radar',\n      franjaSinAlerta: !hoyAlerta,\n      demoNormal: d === 'normal', demoVacio: d === 'vacio', demoCargando: d === 'cargando', demoCaida: d === 'caida',\n      jugadaNormal: d !== 'vacio',\n      soiNormal: d !== 'cargando' && d !== 'caida',\n      timelineNormal: d !== 'cargando',\n      setDemoNormal: () => this.setState({ demo: 'normal' }),\n      setDemoVacio: () => this.setState({ demo: 'vacio' }),\n      setDemoCargando: () => this.setState({ demo: 'cargando' }),\n      setDemoCaida: () => this.setState({ demo: 'caida' }),\n      demoBtnNormal: demoBtn(d === 'normal'), demoBtnVacio: demoBtn(d === 'vacio'),\n      demoBtnCargando: demoBtn(d === 'cargando'), demoBtnCaida: demoBtn(d === 'caida'),\n      drillAdmuseum: drill === 'admuseum', drillMapa: drill === 'mapa',\n      drillDistritos: drill === 'distritos', drillBrief: drill === 'brief',\n      openAdmuseum: () => this.setState({ drill: 'admuseum' }),\n      openMapa: () => this.setState({ drill: 'mapa' }),\n      openDistritos: () => this.setState({ drill: 'distritos' }),\n      openBrief: () => this.setState({ drill: 'brief' }),\n      closeDrill: () => this.setState({ drill: null }),\n      stopClick: (e) => e.stopPropagation(),\n      risk: this.state.risk, riskOff: !this.state.risk,\n      toggleRisk: () => this.setState(s => ({ risk: !s.risk })),\n      riskBtn: btnBase + (this.state.risk ? 'background:#16181F;color:#FFFFFF' : 'background:#F1EDE6;color:#565D6B'),\n      piezas: this.piezas.map((p, i) => ({ ...p, key: i, isTv: p.tipo === 'tv', isOoh: p.tipo === 'ooh', isSocial: p.tipo === 'social', isRadio: p.tipo === 'radio' })),\n      distritos: this.distritos,\n      chatMsgs: this.state.chat.map((m, i) => ({ ...m, key: i, isUser: m.role === 'user', isMaia: m.role === 'maia', hasBars: !!(m.bars && m.bars.length), bars: m.bars || [] })),\n      draft: this.state.draft,\n      setDraft: (e) => this.setState({ draft: e.target.value }),\n      onKey: (e) => { if (e.key === 'Enter') this.sendChat(); },\n      sendChat: this.sendChat,\n      typing: this.state.typing\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
